name: Deploy

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ${{ github.repository }}/backend
  DEPLOY_PATH: /opt/lce
  EXTENSION_DIR: clients/extensions/chrome/lichess-chat-enhanced

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve extension version from the manifest
        id: version
        working-directory: ${{ env.EXTENSION_DIR }}
        run: |
          version=$(node -p "require('./manifest.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Extension version: $version"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: services/lichess_chat_enhanced
          file: services/lichess_chat_enhanced/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    env:
      # These are forwarded to the SSH script below via the action's envs
      # list. The Django secret stays referenced inline: it must not be
      # echoed into a public variable.
      APP_VERSION: ${{ needs.build.outputs.version }}
      PUBLIC_ORIGIN: ${{ secrets.PUBLIC_ORIGIN }}
      DJANGO_ALLOWED_HOSTS: ${{ secrets.DJANGO_ALLOWED_HOSTS }}
      CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install extension dependencies
        working-directory: ${{ env.EXTENSION_DIR }}
        run: pnpm install --frozen-lockfile

      - name: Build the extension bundle
        working-directory: ${{ env.EXTENSION_DIR }}
        run: pnpm build

      # Built here rather than in the build job on purpose: each job gets its
      # own runner, so a zip produced in one job does not exist in the next.
      # The zip plus the manifest: Django reads the manifest to report the real
      # extension version and refuses to advertise a bundle it cannot find.
      # Zipped from inside dist/ so manifest.json lands at the archive root --
      # Chrome's "load unpacked" needs manifest.json in the chosen folder, and
      # making users click into a nested dist/ is a support ticket waiting to
      # happen.
      - name: Package the extension
        run: |
          set -euo pipefail
          cd "$EXTENSION_DIR"
          test -f dist/manifest.json
          rm -f /tmp/lichess-chat-enhanced.zip
          (cd dist && zip -qr /tmp/lichess-chat-enhanced.zip . -x '*.map')
          cp dist/manifest.json /tmp/manifest.json
          echo "zip: $(du -h /tmp/lichess-chat-enhanced.zip | cut -f1)"
          unzip -l /tmp/lichess-chat-enhanced.zip | head -4

      - uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.APPS_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          source: deploy/docker-compose.prod.yml
          target: ${{ env.DEPLOY_PATH }}
          strip_components: 1

      - name: Copy the extension bundle
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.APPS_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          source: /tmp/lichess-chat-enhanced.zip,/tmp/manifest.json
          target: ${{ env.DEPLOY_PATH }}/extension

      # Migrations and the demo seed run in the image entrypoint, so a plain
      # `up -d` is a complete deploy and there is no second thing to forget.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.APPS_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          envs: APP_VERSION,PUBLIC_ORIGIN,DJANGO_ALLOWED_HOSTS,CORS_ALLOWED_ORIGINS
          script: |
            umask 077
            cd ${{ env.DEPLOY_PATH }}
            mkdir -p extension
            cat > .env << EOF
            APP_VERSION=$APP_VERSION
            DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
            DJANGO_DEBUG=False
            DJANGO_ALLOWED_HOSTS=$DJANGO_ALLOWED_HOSTS
            PUBLIC_ORIGIN=$PUBLIC_ORIGIN
            CORS_ALLOWED_ORIGINS=$CORS_ALLOWED_ORIGINS
            CORS_ALLOW_ALL_ORIGINS=true
            EOF

            echo "--- pulling public image anonymously ---"
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Fail the deploy if the container never becomes healthy, instead
            # of reporting success and leaving a broken API behind.
            state=starting
            for i in $(seq 1 30); do
              state=$(docker inspect -f '{{.State.Health.Status}}' lce-backend 2>/dev/null || echo starting)
              [ "$state" = healthy ] && break
              [ "$state" = unhealthy ] && { docker logs --tail 50 lce-backend; exit 1; }
              sleep 5
            done
            [ "$state" = healthy ] || { echo "container never became healthy"; docker logs --tail 50 lce-backend; exit 1; }

            echo "--- healthcheck ---"
            docker exec lce-backend python -c "import urllib.request;print(urllib.request.urlopen('http://127.0.0.1:8000/api/health/').read().decode())"

            docker system prune -f

      - name: Summary
        run: |
          echo "Deployed ${{ needs.build.outputs.version }} to ${{ secrets.APPS_HOST }}:${{ env.DEPLOY_PATH }}"
