[project]
name = "lichess-chat-enhanced"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0.3",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.16.1",
    "djangorestframework-simplejwt>=5.5.1",
    "pillow>=12.1.1",
    "gunicorn>=23.0.0",
]

# Descubrimiento de paquetes explícito: el flat-layout de setuptools falla
# porque docker/, templates/ y media/ parecen top-level packages. Solo
# accounts, emojis y lichess_chat_enhanced son paquetes reales (con __init__).
[tool.setuptools.packages.find]
include = ["lichess_chat_enhanced*", "accounts*", "emojis*"]
exclude = ["docker*", "templates*", "media*"]
